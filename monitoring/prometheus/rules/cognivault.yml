groups:
  - name: cognivault
    rules:
      - alert: CogniVaultDown
        expr: up{job="cognivault"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CogniVault service is down"
          description: "CogniVault has been unreachable for more than 1 minute."

      - alert: HighSearchLatencyP99
        expr: histogram_quantile(0.99, sum(rate(cognivault_search_duration_seconds_bucket[5m])) by (le, type)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P99 search latency"
          description: "P99 search latency is above 2 seconds for the last 5 minutes (type={{ $labels.type }})."

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes{job="cognivault"} > 536870912
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CogniVault high memory usage"
          description: "CogniVault resident memory exceeds 512 MiB (current: {{ $value | humanize1024 }}B)."

      - alert: HighErrorRate
        expr: >
          (
            sum(rate(cognivault_search_requests_total[5m])) == 0
          ) and on() (
            up{job="cognivault"} == 1
          )
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "CogniVault search requests stalled"
          description: "CogniVault is up but no search requests have been processed in the last 30 minutes. Check if the service is receiving traffic."
