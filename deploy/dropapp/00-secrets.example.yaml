# ═══════════════════════════════════════════════════════════════════════════
# ШАБЛОН — НЕ ПРИМЕНЯТЬ `oc apply -f` как есть: значения здесь плейсхолдеры.
# Файл описывает ВСЕ секреты, на которые ссылается набор deploy/dropapp/.
# Реальные секреты создаются командами `oc create secret ...` (см. README, шаг 2).
#
# Сводка (что откуда берётся):
#
#   cognivault-gigachat-certs   создаёте вы    mTLS-сертификаты GigaChat.
#                                              Монтируется в /certs у бэкенда и у UI.
#   vectordb-creds              ПЛАТФОРМА      Basic-auth внешнего Qdrant (DropApp).
#                                              Ключи: username / password.
#                                              НЕ создавать вручную — проверить наличие:
#                                              oc get secret vectordb-creds
#   sberosc-pull                создаёте вы    docker-registry secret для образов
#                                              через прокси SberOSC. Тип
#                                              kubernetes.io/dockerconfigjson —
#                                              шаблоном не задаётся, только командой:
#                                                oc create secret docker-registry sberosc-pull \
#                                                  -n ci05490208-oasis-cognivault \
#                                                  --docker-server=sberosc.sigma.sbrf.ru \
#                                                  --docker-username=token \
#                                                  --docker-password='<ТОКЕН_SBEROSC>'
#   sber-ca                     ОПЦИОНАЛЬНО    PEM-бандл внутреннего УЦ Сбера для
#                                              NODE_EXTRA_CA_CERTS (см. 04-backend.yaml).
#                                              Нужен, только если внешний Qdrant
#                                              предъявляет сертификат внутреннего УЦ.
#
# ВАЖНО про sber-ca: в старой документации он назван то Secret'ом (k8s/README.md),
# то ConfigMap'ом (cognivault-ui.yaml, cognivault-ui/DEPLOY.md). В этом наборе он
# ЕДИНООБРАЗНО **Secret** — так же, как остальные материалы TLS.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: cognivault-gigachat-certs
  labels:
    app.kubernetes.io/name: cognivault
type: Opaque
stringData:
  # Имена ключей = имена файлов, на которые смотрят GIGACHAT_CERT_PATH /
  # GIGACHAT_KEY_PATH в обоих ConfigMap'ах (/certs/client_crt.crt, /certs/client_key.key).
  client_crt.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_CLIENT_CERT
    -----END CERTIFICATE-----
  client_key.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_CLIENT_KEY
    -----END PRIVATE KEY-----
  # Опционально: CA-бандл GigaChat. Если добавили — раскомментируйте
  # GIGACHAT_CA_PATH в 02-configmap-backend.yaml и верните GIGACHAT_VERIFY_SSL: "true".
  # ca.pem: |
  #   -----BEGIN CERTIFICATE-----
  #   REPLACE_WITH_GIGACHAT_CA_CHAIN
  #   -----END CERTIFICATE-----
  #
  # Опционально: пароль приватного ключа. Оба Deployment'а читают его как
  # GIGACHAT_KEY_PASSPHRASE через secretKeyRef с optional: true — если ключа нет,
  # переменная просто не появится, под стартует нормально.
  # key.passphrase: REPLACE_OR_REMOVE
---
# ОПЦИОНАЛЬНО. Секрет с бандлом внутреннего УЦ Сбера. Применять, только если
# проверка связности (README, шаг 3) даёт UNABLE_TO_VERIFY_LEAF_SIGNATURE /
# SELF_SIGNED_CERT_IN_CHAIN на внешнем Qdrant.
#
# Проще создать из файла:
#   oc create secret generic sber-ca -n ci05490208-oasis-cognivault \
#     --from-file=sber-ca.pem=./certs/sber-ca.pem
#
# После этого раскомментировать блок sber-ca в 04-backend.yaml
# (volume + volumeMount /certs-ca + env NODE_EXTRA_CA_CERTS).
apiVersion: v1
kind: Secret
metadata:
  name: sber-ca
  labels:
    app.kubernetes.io/name: cognivault
type: Opaque
stringData:
  sber-ca.pem: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_SBER_INTERNAL_CA_CHAIN
    -----END CERTIFICATE-----
