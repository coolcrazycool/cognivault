# ═══════════════════════════════════════════════════════════════════════════
# ШАБЛОН — НЕ ПРИМЕНЯТЬ как есть: значения здесь плейсхолдеры.
# Файл описывает ВСЕ секреты, на которые ссылается набор deploy/dropapp/.
# Реальные секреты создаются в веб-консоли (см. README, шаг 2).
#
# Сводка (что откуда берётся):
#
#   cognivault-gigachat-certs   создаёте вы    Весь TLS-материал одним секретом:
#                                              клиентская пара mTLS + CA-бандл
#                                              внутреннего УЦ. Монтируется в /certs
#                                              и у бэкенда, и у UI. Используется
#                                              и для GigaChat, и для внешнего Qdrant.
#   vectordb-creds              ПЛАТФОРМА      Basic-auth внешнего Qdrant (DropApp).
#                                              Ключи: username / password.
#                                              НЕ создавать вручную — проверить,
#                                              что он есть в namespace.
#   sberosc-pull                создаёте вы    docker-registry secret для образов
#                                              через прокси SberOSC. Тип
#                                              kubernetes.io/dockerconfigjson —
#                                              шаблоном не задаётся, создаётся формой
#                                              «Image pull secret»:
#                                                server:   sberosc.sigma.sbrf.ru
#                                                username: token
#                                                password: <ТОКЕН_SBEROSC>
#
# Отдельного секрета `sber-ca` в наборе БОЛЬШЕ НЕТ: бандл внутреннего УЦ живёт
# ключом cacert.pem в cognivault-gigachat-certs, поэтому не нужны ни второй
# секрет, ни монтирование в /certs-ca.
#
# Если к namespace есть доступ по CLI, те же три секрета создаются так
# (NS=ci05490208-oasis-cognivault):
#
#   oc create secret generic cognivault-gigachat-certs -n $NS \
#     --from-file=client_crt.crt=./client_crt.crt \
#     --from-file=client_key.key=./client_key.key \
#     --from-file=cacert.pem=./cacert.pem
#   # при зашифрованном приватном ключе добавить:
#   #   --from-literal=key.passphrase='<ПАРОЛЬ_КЛЮЧА>'
#
#   oc create secret docker-registry sberosc-pull -n $NS \
#     --docker-server=sberosc.sigma.sbrf.ru \
#     --docker-username=token \
#     --docker-password='<ТОКЕН_SBEROSC>'
#
#   # vectordb-creds НЕ создаём — только проверяем, что платформа его завела
#   # и в нём есть ровно ключи username и password:
#   oc get secret vectordb-creds -n $NS -o jsonpath='{.data}' | tr ',' '\n'
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: cognivault-gigachat-certs
  labels:
    app.kubernetes.io/name: cognivault
type: Opaque
stringData:
  # Имена ключей = имена файлов в /certs. На них смотрят GIGACHAT_CERT_PATH /
  # GIGACHAT_KEY_PATH И QDRANT_CERT_PATH / QDRANT_KEY_PATH в ConfigMap'ах
  # (/certs/client_crt.crt, /certs/client_key.key).
  client_crt.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_CLIENT_CERT
    -----END CERTIFICATE-----
  client_key.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_CLIENT_KEY
    -----END PRIVATE KEY-----
  # CA-бандл внутреннего УЦ Сбера. Путь /certs/cacert.pem задан в
  # 02-configmap-backend.yaml ключом QDRANT_CA_PATH (активен по умолчанию).
  # Тем же бандлом опционально можно закрыть GigaChat (GIGACHAT_CA_PATH)
  # и Confluence (CONFLUENCE_CA_PATH) — см. комментарии в ConfigMap'ах.
  cacert.pem: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_SBER_INTERNAL_CA_CHAIN
    -----END CERTIFICATE-----
---
# ОПЦИОНАЛЬНО: отдельный клиентский сертификат для KitAI.
#
# Нужен, ТОЛЬКО если контур KitAI требует свою пару. Если один сертификат
# обслуживает и GigaChat, и KitAI — этот секрет не создавайте: пустые
# KITAI_CERT_PATH / KITAI_KEY_PATH означают «взять сертификат GigaChat», и это
# поведение по умолчанию.
#
# Том в 05-ui.yaml смонтирован как `optional: true`, а пути в ConfigMap уже
# проставлены. Без секрета под поднимается нормально: приложение возьмёт
# сертификат GigaChat и напишет WARNING с обоими путями. Значит порядок шагов
# не критичен — но и отсутствие ошибки НЕ означает, что свой сертификат в деле.
#
# Монтируется в /certs/kitai — имена ключей = имена файлов там же.
# Проверить, что взялось: deploy/dropapp/kitai-check.py (печатает выбранный
# сертификат и есть ли файл).
apiVersion: v1
kind: Secret
metadata:
  name: cognivault-kitai-certs
  labels:
    app.kubernetes.io/name: cognivault-ui
type: Opaque
stringData:
  client_crt.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_KITAI_CLIENT_CERT
    -----END CERTIFICATE-----
  client_key.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_KITAI_CLIENT_KEY
    -----END PRIVATE KEY-----
  # Только если ключ зашифрован; тогда ещё KITAI_KEY_PASSPHRASE через env
  # (по образцу GIGACHAT_KEY_PASSPHRASE в 05-ui.yaml).
  # key.passphrase: "REPLACE_OR_DROP"
  #
  # Опционально: пароль приватного ключа. Оба Deployment'а читают его через
  # secretKeyRef с optional: true (бэкенд — как GIGACHAT_KEY_PASSPHRASE и
  # QDRANT_KEY_PASSPHRASE, UI — как GIGACHAT_KEY_PASSPHRASE). Если ключа нет,
  # переменные просто не появятся и под стартует нормально.
  # key.passphrase: REPLACE_OR_REMOVE
