# ═══════════════════════════════════════════════════════════════════════════
# ШАБЛОН — НЕ ПРИМЕНЯТЬ как есть: значения здесь плейсхолдеры.
# Файл описывает ВСЕ секреты, на которые ссылается набор deploy/dropapp/.
# Реальные секреты создаются в веб-консоли (см. README, шаг 2).
#
# Сводка (что откуда берётся):
#
#   cognivault-gigachat-certs   создаёте вы    Весь TLS-материал одним секретом:
#                                              клиентская пара mTLS + CA-бандл
#                                              внутреннего УЦ. Монтируется в /certs
#                                              и у бэкенда, и у UI. Используется
#                                              и для GigaChat, и для внешнего Qdrant.
#   vectordb-creds              ПЛАТФОРМА      Basic-auth внешнего Qdrant (DropApp).
#                                              Ключи: username / password.
#                                              НЕ создавать вручную — проверить,
#                                              что он есть в namespace.
#   sberosc-pull                создаёте вы    docker-registry secret для образов
#                                              через прокси SberOSC. Тип
#                                              kubernetes.io/dockerconfigjson —
#                                              шаблоном не задаётся, создаётся формой
#                                              «Image pull secret»:
#                                                server:   sberosc.sigma.sbrf.ru
#                                                username: token
#                                                password: <ТОКЕН_SBEROSC>
#
# Отдельного секрета `sber-ca` в наборе БОЛЬШЕ НЕТ: бандл внутреннего УЦ живёт
# ключом cacert.pem в cognivault-gigachat-certs, поэтому не нужны ни второй
# секрет, ни монтирование в /certs-ca.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: cognivault-gigachat-certs
  labels:
    app.kubernetes.io/name: cognivault
type: Opaque
stringData:
  # Имена ключей = имена файлов в /certs. На них смотрят GIGACHAT_CERT_PATH /
  # GIGACHAT_KEY_PATH И QDRANT_CERT_PATH / QDRANT_KEY_PATH в ConfigMap'ах
  # (/certs/client_crt.crt, /certs/client_key.key).
  client_crt.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_CLIENT_CERT
    -----END CERTIFICATE-----
  client_key.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_CLIENT_KEY
    -----END PRIVATE KEY-----
  # CA-бандл внутреннего УЦ Сбера. Путь /certs/cacert.pem задан в
  # 02-configmap-backend.yaml ключом QDRANT_CA_PATH (активен по умолчанию).
  # Тем же бандлом опционально можно закрыть GigaChat (GIGACHAT_CA_PATH)
  # и Confluence (CONFLUENCE_CA_PATH) — см. комментарии в ConfigMap'ах.
  cacert.pem: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_SBER_INTERNAL_CA_CHAIN
    -----END CERTIFICATE-----
  #
  # Опционально: пароль приватного ключа. Оба Deployment'а читают его через
  # secretKeyRef с optional: true (бэкенд — как GIGACHAT_KEY_PASSPHRASE и
  # QDRANT_KEY_PASSPHRASE, UI — как GIGACHAT_KEY_PASSPHRASE). Если ключа нет,
  # переменные просто не появятся и под стартует нормально.
  # key.passphrase: REPLACE_OR_REMOVE
