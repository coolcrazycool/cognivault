# Бэкенд CogniVault: Deployment + ClusterIP Service.
#
# Service обязателен: на него смотрит COGNIVAULT_BASE_URL="http://cognivault:3000"
# из ConfigMap UI. Без Service морда не найдёт API.
#
# Наружу бэкенд НЕ выставляется: снаружи доступен только UI (06-ingress.yaml).
#
# ⚠️ ХРАНИЛИЩЕ — /data смонтирован как emptyDir. PVC в namespace НЕТ ни одного:
# платформа их не выдаёт. При каждом перезапуске или перепланировке пода
# ТЕРЯЮТСЯ: /data/users.json (все cv-токены — пользователей заводить заново),
# SQLite-индекс /data/index.db и содержимое волтов /data/vaults/* (сами
# документы). Порядок восстановления — README, раздел 10. Когда платформа даст
# PVC, том `data` внизу файла меняется обратно на persistentVolumeClaim —
# правок в коде не требуется, mountPath тот же.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognivault
  labels:
    app.kubernetes.io/name: cognivault
    app.kubernetes.io/component: api
spec:
  # Строго 1 реплика. Причин три, и каждой по отдельности достаточно:
  #  1. users.json рассчитан ровно на одного писателя;
  #  2. SQLite-индекс — тоже, а реплики не разделяют /data (у каждой свой
  #     emptyDir), поэтому replicas > 1 дало бы расходящиеся состояния и битый
  #     SQLite;
  #  3. обслуживание индекса из UI (переиндексация вольта и ПЕРЕСОЗДАНИЕ
  #     коллекции) держит и блокировку, и реестр задач В ПАМЯТИ ПРОЦЕССА.
  #     Две реплики = две независимые блокировки: два пода спокойно начнут два
  #     пересоздания одновременно, второе снесёт наиндексированное первым, а
  #     статус задачи будет знать только тот под, который её начал.
  # Масштабировать можно только вместе с общим томом (RWX), дизайном под
  # нескольких писателей и распределённой блокировкой. README, разделы 3.7 и 10.4.
  replicas: 1
  strategy:
    # Recreate (не RollingUpdate): два пода бэкенда одновременно недопустимы —
    # каждый писал бы свой users.json и свой SQLite-индекс, и у каждого была бы
    # своя блокировка пересоздания коллекции.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cognivault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cognivault
        app.kubernetes.io/component: api
      annotations:
        # Скрейп Prometheus (безвреден, если кластер это игнорирует).
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      # Нужен, чтобы стянуть образ через прокси SberOSC (user: token).
      imagePullSecrets:
        - name: sberosc-pull
      securityContext:
        # Namespace с restricted PodSecurity. Пользователь node в образе — uid 1000;
        # указываем числом, иначе runAsNonRoot не проверяется. fsGroup задаёт
        # группу-владельца смонтированных томов, чтобы /data был записываем
        # для этого uid.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cognivault
          # ── ОБРАЗ ────────────────────────────────────────────────────────
          # Собирается в GitHub Actions и публикуется в ghcr.io/coolcrazycool/cognivault
          # (пакет должен быть PUBLIC), сюда тянется ЧЕРЕЗ прокси SberOSC.
          # Тег всегда конкретный, иммутабельный sha-<gitsha>: SberOSC не проксирует
          # `latest` и кеширует вердикт скана по digest.
          #
          # Пины бэкенда и UI могут расходиться: образы собираются независимо,
          # каждый из своего пути, и компонент, который не менялся, остаётся на
          # прежнем коммите. Здесь они РАЗНЫЕ: бэкенд из b5d3c60, UI из 977445a — последние правки
          # затронули только src/, поэтому образ UI не пересобирался.
          #
          # ⛔ ЭТО ПИН ПРЕДЫДУЩЕГО РЕЛИЗА. Образ текущего релиза (конвертер,
          # чанкер, BM25 v3, пересоздание коллекции из UI) ещё НЕ ОПУБЛИКОВАН:
          # ветка не запушена, сборка по ней не запускалась. Тег подставляется
          # ТОЛЬКО после успешного прогона GitHub Actions и только тот, что
          # реально появился в ghcr — выдуманный тег даёт ImagePullBackOff
          # (`manifest unknown`), а `latest` SberOSC не проксирует.
          # Порядок — README, врезка про образы в начале и раздел 8.
          #
          # ⚠️ ЭТОТ ОБРАЗ ТРЕБУЕТ РАЗОВОЙ МИГРАЦИИ КОЛЛЕКЦИИ QDRANT.
          # Схема сменилась на именованные векторы (dense + sparse bm25), и
          # `cognivault` теперь ожидается как АЛИАС, а не как коллекция. Если на
          # сервере он существует коллекцией — под НЕ поднимется, это защита от
          # тихой записи в старую схему. Порядок — README, раздел «Миграция
          # коллекции».
          #
          # ⚠️ А ОБРАЗ СЛЕДУЮЩЕГО РЕЛИЗА ПОТРЕБУЕТ ПЕРЕСОЗДАНИЯ КОЛЛЕКЦИИ.
          # BM25_SCHEME_VERSION меняется 2 -> 3: все сохранённые разреженные
          # векторы становятся несопоставимыми с запросом. Под при этом
          # поднимается и работает — деградирует только лексическая ветвь
          # поиска, поэтому шаг легко пропустить. Делается из UI (настройки ->
          # «Индекс и поиск» -> «Пересоздать коллекцию»), README, раздел 3.7.
          image: sberosc.sigma.sbrf.ru/ghcr.io/coolcrazycool/cognivault:sha-b5d3c60
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: cognivault-config
          env:
            # Пароль приватного ключа — только если ключ зашифрован.
            # optional: true → если ключа key.passphrase в секрете нет, под стартует.
            - name: GIGACHAT_KEY_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: cognivault-gigachat-certs
                  key: key.passphrase
                  optional: true
            # ── Аутентификация внешнего Qdrant (QDRANT_URL в ConfigMap) ────
            # За адресом QDRANT_URL стоит НЕ голый Qdrant, а Platform V Vector DB —
            # надстройка Сбера. У неё нет UI, соединение только по mTLS, а запросы
            # к самой СУБД авторизуются JWT-токеном. Схема целиком:
            #
            #   1. mTLS-соединение клиентским сертификатом (QDRANT_CERT_PATH /
            #      QDRANT_KEY_PATH в ConfigMap) — без него не открывается вообще
            #      ничего, включая /auth;
            #   2. POST ${QDRANT_URL}/auth с телом {"username":…,"password":…} →
            #      200 {"result":{"token":"eyJ0eXAiOiJKV1Q…"}};
            #   3. запросы к СУБД идут с заголовком `Authorization: Bearer <токен>`.
            #
            # Токен живёт ЧАС и обновляется приложением автоматически (за 5 минут
            # до истечения, ключ QDRANT_TOKEN_REFRESH_SKEW_MS). Перезапуск пода для
            # этого не нужен, ротации секрета — тоже.
            #
            # ВАРИАНТ 1 (основной, действующий): username/password → IAM → JWT.
            # Секрет vectordb-creds заводит платформа DropApp; username — это ТУЗ,
            # password — пароль доменного пользователя. К СУБД они НЕ уходят:
            # приложение меняет их на токен и дальше отправляет только его.
            # Задавать ОБА ключа или НИ ОДНОГО — при одном под падает на валидации.
            - name: QDRANT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vectordb-creds
                  key: username
            - name: QDRANT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vectordb-creds
                  key: password
            #
            # ВАРИАНТ 2 (альтернатива, выключен): статический api-key. Нужен, ТОЛЬКО
            # если за адресом когда-нибудь окажется СЫРОЙ Qdrant с включённой родной
            # аутентификацией — тогда ключ уходит заголовком `api-key`. На Platform V
            # Vector DB это не работает: проверено, сервер отвечает
            #   401 {"status":{"error":"Invalid API key or JWT. If you are using API
            #        key while security RBAC is enabled, consider to use JWT"}}
            # Чтобы переключиться: закомментировать пару выше и раскомментировать
            # блок ниже. Включать оба варианта ОДНОВРЕМЕННО нельзя — приложение
            # падает на валидации конфига.
            # - name: QDRANT_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: vectordb-creds
            #       key: password
            #
            # При откате на внутрикластерный Qdrant (99-qdrant-inhouse.yaml,
            # аутентификации нет) весь этот блок убрать вместе со сменой QDRANT_URL.
            # Пароль приватного ключа, которым бэкенд открывает mTLS до внешнего
            # Qdrant (QDRANT_CERT_PATH / QDRANT_KEY_PATH в ConfigMap).
            # Ключ переиспользуется от GigaChat, поэтому и пароль тот же секрет.
            # optional: true → если ключа key.passphrase в секрете нет, под стартует.
            - name: QDRANT_KEY_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: cognivault-gigachat-certs
                  key: key.passphrase
                  optional: true
            # ── CA внутреннего УЦ ──────────────────────────────────────────
            # Отдельного секрета и отдельного монтирования НЕТ: бандл лежит в
            # cognivault-gigachat-certs ключом cacert.pem и доступен по пути
            # /certs/cacert.pem. Путь задан ключом QDRANT_CA_PATH в
            # 02-configmap-backend.yaml, ENV-переменной для этого не нужно.
            # NODE_EXTRA_CA_CERTS не используется вовсе.
            #
            # АВАРИЙНЫЙ КОСТЫЛЬ, применять только если всё остальное не помогло:
            # - name: NODE_TLS_REJECT_UNAUTHORIZED
            #   value: "0"
            # ⚠️ Это ГЛОБАЛЬНЫЙ тумблер процесса: снимает проверку сертификата не
            # только для Qdrant, но и для GigaChat — MITM станет незаметен.
            # Штатная замена — QDRANT_VERIFY_SSL: "false" в ConfigMap: она гасит
            # проверку ТОЛЬКО для host:port Qdrant. А правильное решение — CA-бандл
            # в QDRANT_CA_PATH и QDRANT_VERIFY_SSL: "true".
          volumeMounts:
            - name: data
              mountPath: /data
            # Клиентские сертификаты И CA-бандл (cacert.pem) — один секрет.
            - name: gigachat-certs
              mountPath: /certs
              readOnly: true
          # И liveness, и readiness бьют в /health. /ready отдаёт 503, пока не задан
          # VAULT_PATH (мультитенантный режим) — для проб он НЕ годится.
          startupProbe:
            httpGet:
              path: /health
              port: http
            # Запас на подключение к Qdrant и миграции по пользователям при старте.
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            # false осознанно: приложение пишет во временные файлы вне /data
            # (кеш, временные файлы SQLite). readOnlyRootFilesystem: true
            # потребовал бы отдельных emptyDir на /tmp и рабочий каталог.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        # emptyDir, а не PVC: в namespace нет ни одного PVC — платформа их не
        # выдаёт. Данные эфемерны, см. предупреждение вверху файла.
        - name: data
          emptyDir: {}
        - name: gigachat-certs
          secret:
            secretName: cognivault-gigachat-certs
            # 0440, а НЕ 0400. Файлы секрета принадлежат root:fsGroup (root:1000),
            # процесс работает под uid 1000 — при 0400 читать может только root,
            # и приложение падает на старте, когда синхронно читает cacert.pem и
            # client_key.key. 0440 даёт чтение группе 1000 и по-прежнему закрывает
            # доступ всем остальным (дефолт 0644 читаем кем угодно в контейнере).
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: cognivault
  labels:
    app.kubernetes.io/name: cognivault
    app.kubernetes.io/component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cognivault
  ports:
    - name: http
      port: 3000
      targetPort: http
