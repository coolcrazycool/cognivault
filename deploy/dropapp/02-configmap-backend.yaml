# Несекретная конфигурация бэкенда (cognivault). Секреты — только через
# secretKeyRef в 04-backend.yaml (сертификаты GigaChat, креды Qdrant).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cognivault-config
  labels:
    app.kubernetes.io/name: cognivault
    app.kubernetes.io/component: api
data:
  # ── Сервер ────────────────────────────────────────────────────────────
  PORT: "3000"
  HOST: "0.0.0.0"
  LOG_LEVEL: "info"
  COGNIVAULT_DATA_DIR: "/data"
  # VAULT_PATH намеренно НЕ задан: в мультитенантном режиме у каждого
  # пользователя свой vaultPath. Глобальный VAULT_PATH меняет семантику /ready,
  # поэтому пробы бьют в /health, а не в /ready (см. 04-backend.yaml).

  # ── Файловый поллер (индексация волтов) ───────────────────────────────
  # Индексатор не подписан на inotify, а опрашивает каталоги пользователей:
  # POLL_INTERVAL_MS — период обхода; STABILITY_DELAY_MS — сколько файл должен
  # пролежать неизменным, прежде чем его возьмут в работу (защита от индексации
  # наполовину записанного файла). Значения = дефолты кода, вынесены явно, чтобы
  # их было где крутить: увеличивать при большом волте и заметной нагрузке на
  # диск, уменьшать — если нужен более быстрый отклик на правку файла.
  POLL_INTERVAL_MS: "5000"
  STABILITY_DELAY_MS: "2000"
  #
  # Трассировка OTLP. Не задано → телеметрия не экспортируется вовсе. Задавать
  # только при наличии коллектора в контуре (метрики Prometheus по /metrics
  # работают независимо от этого ключа).
  # OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"

  # ── Векторное хранилище (ВНЕШНИЙ Qdrant в DropApp) ────────────────────
  # За этим адресом стоит Platform V Vector DB — надстройка Сбера над Qdrant, а
  # не голый Qdrant: UI нет, соединение только по mTLS, запросы к СУБД
  # авторизуются JWT-токеном.
  # Приложение подключается на старте и создаёт коллекцию `cognivault` — СУБД
  # должна быть доступна ДО выкатки, иначе под уходит в CrashLoop (startupProbe
  # даёт ~150 с ретраев).
  #
  # АУТЕНТИФИКАЦИЯ (штатная схема):
  #   1) mTLS клиентским сертификатом — см. блок TLS ниже;
  #   2) POST ${QDRANT_URL}/auth с {"username":…,"password":…} → JWT;
  #   3) `Authorization: Bearer <токен>` на каждый запрос к СУБД.
  # Токен живёт час и обновляется автоматически (QDRANT_TOKEN_REFRESH_SKEW_MS).
  # Пара username/password (ТУЗ и доменный пароль) СЕКРЕТНА и в ConfigMap не
  # кладётся: она приходит из секрета vectordb-creds через secretKeyRef
  # (см. 04-backend.yaml). Альтернатива — статический QDRANT_API_KEY — оставлена
  # там же закомментированной на случай сырого Qdrant; включать оба варианта
  # ОДНОВРЕМЕННО нельзя, приложение падает на валидации конфига.
  # Резервный хост, переключается вручную (клиентской балансировки нет):
  #   https://tsled-oasis0002.esrt.sber.ru:6433
  # Откат на внутрикластерный Qdrant (99-qdrant-inhouse.yaml): "http://qdrant:6333".
  QDRANT_URL: "https://tsled-oasis0001.esrt.sber.ru:6433"
  # Таймаут одного запроса, мс. Дефолт клиента 300000 — для внешнего хопа много.
  # Тот же таймаут применяется и к обмену на /auth.
  QDRANT_TIMEOUT_MS: "30000"
  #
  # Адрес IAM-сервиса, который выпускает токен. По умолчанию вычисляется как
  # ${QDRANT_URL}/auth — и на нашем стенде это ВЕРНО: проверено, IAM отвечает на
  # том же порту 6433, что и сама СУБД (так устроены версии Vector DB >= 2.0.0).
  # Для версий < 2.0.0 IAM слушает на ОТДЕЛЬНОМ порту 6533 (REST) / 6534 (gRPC) —
  # тогда ключ надо задать явно. Примеры curl в документации вендора всегда
  # показывают :6533 и противоречат её же тексту, поэтому адрес и вынесен в
  # конфигурацию, а не выведен из QDRANT_URL жёстко.
  # QDRANT_AUTH_URL: "https://tsled-oasis0001.esrt.sber.ru:6533/auth"
  #
  # За сколько до истечения токена запрашивать новый, мс. Токен живёт час,
  # 5 минут запаса переживают медленный ответ IAM. Обновление идёт по таймеру в
  # фоне; ошибка обновления не роняет под — попытка повторяется через 30 с.
  # QDRANT_TOKEN_REFRESH_SKEW_MS: "300000"

  # ── TLS до внешнего Qdrant ────────────────────────────────────────────
  # Qdrant-клиент своих TLS-опций НЕ имеет и создаёт собственный undici-Agent,
  # поэтому приложение перехватывает tls.connect и подмешивает материал ниже
  # ТОЛЬКО для пары host:port из QDRANT_URL. Остальной TLS-трафик (GigaChat,
  # Confluence, OTLP) проходит нетронутым.
  # NODE_EXTRA_CA_CERTS и NODE_TLS_REJECT_UNAUTHORIZED больше НЕ нужны.
  #
  # CA внутреннего УЦ. Бандл лежит в ТОМ ЖЕ секрете cognivault-gigachat-certs
  # (ключ cacert.pem), что и клиентские сертификаты, — отдельный секрет и
  # отдельное монтирование не нужны, /certs уже смонтирован.
  # ВНИМАНИЕ: заданный CA ЗАМЕНЯЕТ системное хранилище корней (для Qdrant).
  QDRANT_CA_PATH: "/certs/cacert.pem"
  #
  # Клиентский сертификат: Platform V Vector DB принимает соединения ТОЛЬКО по
  # mTLS — клиент обязан предъявить свой сертификат, иначе не открывается ни
  # /auth, ни сама СУБД. Специальных сертификатов для неё нет, подходит любая
  # валидная пара, поэтому переиспользуем уже смонтированный секрет
  # cognivault-gigachat-certs (/certs). Задавать оба ключа или ни одного:
  # при одном приложение падает на валидации конфига.
  # Тот же материал используется и для запроса токена на /auth — включая случай,
  # когда IAM вынесен на отдельный порт (QDRANT_AUTH_URL выше).
  QDRANT_CERT_PATH: "/certs/client_crt.crt"
  QDRANT_KEY_PATH: "/certs/client_key.key"
  # Пароль ключа (если он зашифрован) — QDRANT_KEY_PASSPHRASE, приходит из того же
  # секрета через secretKeyRef в 04-backend.yaml, здесь его быть не должно.
  #
  # Проверка сертификата СЕРВЕРА Qdrant. "true" — штатный режим: цепочка
  # проверяется по бандлу из QDRANT_CA_PATH выше. "false" — только временный
  # escape hatch, если бандл не подошёл. В отличие от
  # NODE_TLS_REJECT_UNAUTHORIZED=0 это гасит проверку ТОЛЬКО для host:port
  # Qdrant, GigaChat не затрагивается.
  QDRANT_VERIFY_SSL: "true"
  #
  # Скалярная int8-квантизация плотного вектора. Применяется ТОЛЬКО в момент
  # СОЗДАНИЯ коллекции — переключение на живой коллекции ничего не изменит.
  # "false" по умолчанию: СУБД внешняя и управляется централизованно, размен
  # «память против точности» — решение эксплуатации; включить можно позже одним
  # update_collection, не трогая это приложение.
  QDRANT_QUANTIZATION: "false"

  # ── Эмбеддинги: GigaChat ──────────────────────────────────────────────
  # Провайдер выбирает и эмбеддер, и способ аутентификации. При "gigachat"
  # обязательны GIGACHAT_CERT_PATH, GIGACHAT_KEY_PATH и EMBEDDING_DIMENSIONS —
  # без любого из них приложение падает на валидации конфига, под не поднимется.
  # Ключи OPENAI_API_KEY / OPENAI_BASE_URL / EMBEDDING_MODEL относятся только к
  # провайдеру "openai" и здесь не нужны — при "gigachat" они игнорируются.
  EMBEDDING_PROVIDER: "gigachat"
  GIGACHAT_BASE_URL: "https://gigachat-ift.sberdevices.delta.sbrf.ru/v1"
  GIGACHAT_MODEL: "EmbeddingsGigaR"
  # EmbeddingsGigaR АСИММЕТРИЧНА: инструкцию несёт только поисковый ЗАПРОС,
  # документы — никогда (поэтому смена строки НЕ требует переиндексации).
  # "{query}" подставляется текстом запроса; шаблон без плейсхолдера просто
  # добавляется в начало; пустое значение отключает инструкцию.
  # ВНИМАНИЕ: `\n` внутри ДВОЙНЫХ кавычек YAML разворачивается в настоящий
  # перевод строки — строка побайтово совпадает с дефолтом в src/config.ts.
  # В одинарных кавычках или без кавычек это сломается (будет литерал \n).
  GIGACHAT_QUERY_INSTRUCTION: "Дан вопрос, необходимо найти абзац текста с ответом \nвопрос: {query}"
  # Размерность вектора EmbeddingsGigaR. Неверное число → нужна новая коллекция
  # Qdrant и полная переиндексация (на старте приложение падает на несовпадении).
  EMBEDDING_DIMENSIONS: "2560"
  # Пути к файлам из смонтированного секрета cognivault-gigachat-certs (/certs).
  GIGACHAT_CERT_PATH: "/certs/client_crt.crt"
  GIGACHAT_KEY_PATH: "/certs/client_key.key"
  # CA-бандл внутреннего УЦ (cacert.pem) лежит в том же секрете и уже используется
  # для Qdrant (QDRANT_CA_PATH выше). ЕСЛИ подключение к Qdrant по нему заработало,
  # логично попробовать тот же бандл и для GigaChat: раскомментировать строку ниже
  # и поменять GIGACHAT_VERIFY_SSL на "true". По умолчанию НЕ включено — не
  # проверено, что этот бандл покрывает цепочку хоста GigaChat; при несовпадении
  # эмбеддинги перестанут работать (UNABLE_TO_VERIFY_LEAF_SIGNATURE).
  # GIGACHAT_CA_PATH: "/certs/cacert.pem"
  # Временный escape hatch: проверка сертификата сервера GigaChat снята (как в
  # эталонном локальном Giga_sigma).
  GIGACHAT_VERIFY_SSL: "false"

  # ── Тюнинг GigaChat (значения проверены на локальном контуре) ─────────
  GIGACHAT_MAX_REQUEST_BYTES: "120000"
  GIGACHAT_MAX_BATCH_ITEMS: "64"
  # Лимит токенов на ОДИН HTTP-запрос (сумма по батчу).
  # Да, он меньше GIGACHAT_MAX_EMBEDDING_TOKENS ("3300") — и это НЕ конфликт:
  # чанки индексатора режутся примерно по 500 токенов, поэтому реальный вход
  # никогда не упирается в 3300, а батчи бьются по 2048. Поднимать это значение
  # нужно только если на длинных документах полезли ошибки
  # «Tokens limit exceeded» — тогда 2048 → 3300 (и следить за 413 от шлюза).
  GIGACHAT_MAX_REQUEST_TOKENS: "2048"
  # Реальный контекст модели — 4096 токенов на вход. cl100k недосчитывает
  # русские токены примерно на 20 % относительно токенизатора GigaChat, поэтому
  # 3300 cl100k ≈ 4000 токенов GigaChat: контекст используется полностью, запас
  # остаётся. Снизить (напр. до 2500), если снова полезет «Tokens limit exceeded».
  GIGACHAT_MAX_EMBEDDING_TOKENS: "3300"
  GIGACHAT_MAX_RETRIES: "5"
  GIGACHAT_RETRY_BASE_DELAY_MS: "1000"

  # ── Обогащение чанков при индексации (Волна 4) ────────────────────────────
  # Индексатор ходит в chat/completions GigaChat поверх той же mTLS-пары, что и
  # эмбеддинги, и добавляет две вещи:
  #   * аннотацию документа в начало каждого его чанка (INDEX_DOC_SUMMARY) —
  #     один вызов на документ, результат кэшируется в SQLite по content_hash,
  #     то есть при переиндексации неизменённых файлов вызовов не будет;
  #   * краткое описание большой таблицы отдельной точкой (INDEX_TABLE_SUMMARY),
  #     чтобы агрегатные вопросы («сколько всего», «какие бывают») находили
  #     таблицу целиком, а не случайную группу строк.
  # Сбой любого из вызовов НЕ фатален: чанк просто индексируется без аннотации,
  # в логах остаётся warn. Выключать имеет смысл, если жалко квоту GigaChat —
  # качество ретрива при этом заметно просядет на больших документах.
  INDEX_DOC_SUMMARY: "true"
  INDEX_TABLE_SUMMARY: "true"
  # Модель для суммаризации. Это НЕ модель эмбеддингов (GIGACHAT_MODEL) и не та,
  # что отвечает в чате (она задаётся в ConfigMap UI) — здесь нужна самая дешёвая
  # из доступных, задача простая.
  GIGACHAT_CHAT_MODEL: "GigaChat"
  GIGACHAT_CHAT_TIMEOUT_MS: "30000"
  # Аннотация — одно-два предложения, больше и не нужно.
  GIGACHAT_CHAT_MAX_TOKENS: "300"
