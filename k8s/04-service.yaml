apiVersion: v1
kind: Service
metadata:
  name: cognivault
  labels:
    app.kubernetes.io/name: cognivault
    app.kubernetes.io/component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cognivault
  ports:
    - name: http
      port: 3000
      targetPort: http
