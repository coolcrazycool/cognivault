apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cognivault-data
  labels:
    app.kubernetes.io/name: cognivault
    app.kubernetes.io/component: api
spec:
  # RWO is correct: a single cognivault pod is the only writer of
  # /data (users.json + per-user SQLite index DBs + default vaults).
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # Leave storageClassName unset to use the cluster default. Uncomment and set
  # if your project requires an explicit class (see StorageClasses in the console).
  # storageClassName: ""
