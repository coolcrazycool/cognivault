# ─────────────────────────────────────────────────────────────────────────
# OPTIONAL — apply ONLY if the service mesh blocks egress by default
# (Istio outboundTrafficPolicy = REGISTRY_ONLY). The project carries an Istio
# revision label (istio.io/rev=synapse-control-panel), so the sidecar may deny
# calls to hosts it doesn't know. These ServiceEntries whitelist the two
# external dependencies: GigaChat and the external Qdrant.
#
# The app originates its own TLS (mTLS client cert) to GigaChat. With protocol
# TLS the sidecar does SNI passthrough and does NOT re-terminate — so the client
# certificate reaches GigaChat intact. Do not add a DestinationRule that
# originates TLS for this host.
#
# If the mesh uses ALLOW_ANY (the Istio default), you do NOT need this file.
#
# NOTE: Qdrant is now EXTERNAL (DropApp, tsled-oasis000{1,2}.esrt.sber.ru:6433),
# so it needs a ServiceEntry too — the in-cluster Deployment (08-qdrant.yaml) is
# no longer used. Both Qdrant hosts are whitelisted: only one is configured in
# QDRANT_URL at a time, the other is a manual standby.
# ─────────────────────────────────────────────────────────────────────────
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: gigachat-egress
  labels:
    app.kubernetes.io/name: cognivault
spec:
  hosts:
    - gigachat-ift.sberdevices.delta.sbrf.ru
  ports:
    - number: 443
      name: https
      protocol: TLS
  resolution: DNS
  location: MESH_EXTERNAL
---
# External Qdrant (DropApp). Same reasoning as GigaChat: the app speaks HTTPS
# itself, so `protocol: TLS` keeps the sidecar in SNI-passthrough mode instead of
# re-terminating. Do NOT add a DestinationRule with TLS origination here.
# Both nodes are listed — QDRANT_URL points at one, the other is a manual standby.
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: qdrant-external-egress
  labels:
    app.kubernetes.io/name: cognivault
spec:
  hosts:
    - tsled-oasis0001.esrt.sber.ru
    - tsled-oasis0002.esrt.sber.ru
  ports:
    - number: 6433
      name: https-qdrant
      protocol: TLS
  resolution: DNS
  location: MESH_EXTERNAL
