apiVersion: v1
kind: ConfigMap
metadata:
  name: cognivault-config
  labels:
    app.kubernetes.io/name: cognivault
    app.kubernetes.io/component: api
data:
  # ── Server ────────────────────────────────────────────────────────────
  PORT: "3000"
  HOST: "0.0.0.0"
  LOG_LEVEL: "info"
  COGNIVAULT_DATA_DIR: "/data"
  # NOTE: VAULT_PATH is intentionally NOT set. In multi-tenant mode each user
  # carries its own vaultPath; setting a global VAULT_PATH would change /ready
  # semantics. Probes therefore hit /health, not /ready (see the Deployment).

  # ── Vector store (EXTERNAL Qdrant in DropApp) ─────────────────────────
  # The app connects at startup and creates the `cognivault` collection — Qdrant
  # MUST be reachable first or the pod crash-loops (startupProbe gives ~150s of
  # retries). The external instance sits behind a reverse proxy with HTTP Basic
  # auth: QDRANT_USERNAME/QDRANT_PASSWORD come from the `vectordb-creds` secret
  # (see the Deployment) — never put them here.
  # Standby host, switch by hand (there is no client-side load balancing):
  #   https://tsled-oasis0002.esrt.sber.ru:6433
  # Rollback to the in-cluster Qdrant (08-qdrant.yaml): "http://qdrant:6333".
  QDRANT_URL: "https://tsled-oasis0001.esrt.sber.ru:6433"
  # Per-request timeout in ms (client default is 300000 — far too long).
  QDRANT_TIMEOUT_MS: "30000"

  # ── Embeddings: GigaChat ──────────────────────────────────────────────
  EMBEDDING_PROVIDER: "gigachat"
  GIGACHAT_BASE_URL: "https://gigachat-ift.sberdevices.delta.sbrf.ru/v1"
  GIGACHAT_MODEL: "EmbeddingsGigaR"
  # EmbeddingsGigaR is an ASYMMETRIC model: the search QUERY carries a task instruction
  # that documents never get (so no re-index is needed when this changes). "{query}" is
  # substituted with the query text; a template without the placeholder is prepended;
  # an empty value disables the instruction. Note the literal newline (\n) before "вопрос:".
  GIGACHAT_QUERY_INSTRUCTION: "Дан вопрос, необходимо найти абзац текста с ответом \nвопрос: {query}"
  # Vector size of EmbeddingsGigaR (from the proven local docker-compose.override).
  # A wrong number forces a fresh Qdrant collection + full re-index later.
  EMBEDDING_DIMENSIONS: "2560"
  # File paths — provided by the mounted `cognivault-gigachat-certs` secret.
  # Filenames match the local certs (client_crt.crt / client_key.key).
  GIGACHAT_CERT_PATH: "/certs/client_crt.crt"
  GIGACHAT_KEY_PATH: "/certs/client_key.key"
  # Uncomment once the internal Sber CA bundle is mounted (secret key `ca.pem`):
  # GIGACHAT_CA_PATH: "/certs/ca.pem"
  # Local ran with verification OFF (verify_ssl_certs=False in Giga_sigma). Keep
  # "false" as a temporary escape hatch until the CA bundle is available, then set
  # GIGACHAT_CA_PATH above and flip back to "true".
  GIGACHAT_VERIFY_SSL: "false"

  # ── GigaChat tuning (matches the proven local config) ─────────────────
  GIGACHAT_MAX_REQUEST_BYTES: "120000"
  GIGACHAT_MAX_BATCH_ITEMS: "64"
  GIGACHAT_MAX_REQUEST_TOKENS: "2048"
  # Real model context is 4096 tokens/input. cl100k undercounts Russian by ~20% vs
  # GigaChat's tokenizer, so 3300 cl100k ≈ 4000 GigaChat tokens — uses the full context
  # while keeping headroom. Lower it again if "Tokens limit exceeded" reappears.
  GIGACHAT_MAX_EMBEDDING_TOKENS: "3300"
  GIGACHAT_MAX_RETRIES: "5"
  GIGACHAT_RETRY_BASE_DELAY_MS: "1000"
