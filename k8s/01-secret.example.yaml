# ─────────────────────────────────────────────────────────────────────────
# TEMPLATE — DO NOT `oc apply` this file as-is (the values are placeholders).
# Create the real secret from your PEM files instead, e.g.:
#
#   oc create secret generic cognivault-gigachat-certs \
#     --namespace ci05490208-oasis-cognivault \
#     --from-file=./certs/client_crt.crt \
#     --from-file=./certs/client_key.key \
#     --from-file=./certs/ca.pem            # optional
#
# (--from-file=./path uses the filename as the secret key — matches the local
#  cert filenames client_crt.crt / client_key.key.)
#
# If the private key has a passphrase, add it and set GIGACHAT_KEY_PASSPHRASE
# on the Deployment via `valueFrom.secretKeyRef` (key: key.passphrase):
#     --from-literal=key.passphrase='...'
#
# The Deployment mounts this secret at /certs (readOnly). Keys used:
#   client_crt.crt  -> GIGACHAT_CERT_PATH
#   client_key.key  -> GIGACHAT_KEY_PATH
#   ca.pem          -> GIGACHAT_CA_PATH (optional; uncomment in ConfigMap)
#   key.passphrase  -> GIGACHAT_KEY_PASSPHRASE (optional)
# ─────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: cognivault-gigachat-certs
  labels:
    app.kubernetes.io/name: cognivault
type: Opaque
stringData:
  client_crt.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_CLIENT_CERT
    -----END CERTIFICATE-----
  client_key.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_CLIENT_KEY
    -----END PRIVATE KEY-----
  # ca.pem: |
  #   -----BEGIN CERTIFICATE-----
  #   REPLACE_WITH_SBER_CA_CHAIN
  #   -----END CERTIFICATE-----
  # key.passphrase: REPLACE_OR_REMOVE
